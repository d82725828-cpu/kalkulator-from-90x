
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator.exe</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="desktop">
    <div class="icon">
        <span>🖥️</span>
        Мой компьютер
    </div>
    <div class="icon">
        <span>🗑️</span>
        Корзина
    </div>
</div>

<div class="window">
    <div class="titlebar">
        <span>🖩 Calculator.exe</span>
        <button class="close" onclick="showError()">×</button>
    </div>

    <div class="menu">
        Файл Правка Вид Справка
    </div>

    <input class="display" id="display" value="0" readonly>

    <div class="status" id="status">
        SYSTEM READY — ЖДЁМ ВАШИХ ДЕЙСТВИЙ
    </div>

    <div class="buttons">
        <button class="key clear" onclick="clearDisplay()">C</button>
        <button class="key" onclick="deleteLast()">←</button>
        <button class="key operator" onclick="add('/')">÷</button>
        <button class="key operator" onclick="add('*')">×</button>

        <button class="key" onclick="add('7')">7</button>
        <button class="key" onclick="add('8')">8</button>
        <button class="key" onclick="add('9')">9</button>
        <button class="key operator" onclick="add('-')">−</button>

        <button class="key" onclick="add('4')">4</button>
        <button class="key" onclick="add('5')">5</button>
        <button class="key" onclick="add('6')">6</button>
        <button class="key operator" onclick="add('+')">+</button>

        <button class="key" onclick="add('1')">1</button>
        <button class="key" onclick="add('2')">2</button>
        <button class="key" onclick="add('3')">3</button>
        <button class="key equal" onclick="calculate()" style="grid-row:span 2;height:101px">=</button>

        <button class="key" onclick="add('0')">0</button>
        <button class="key" onclick="add('.')">.</button>
        <button class="key" onclick="add('00')">00</button>
    </div>

    <div class="footer">
        <span>Microsoft Calculator 98</span>
        <span>RAM: 640 KB</span>
    </div>
</div>

<div class="taskbar">
    <button class="start">🪟 Пуск</button>
    <span>🖩 Calculator.exe</span>
    <div class="clock" id="clock">00:00</div>
</div>

<div class="popup" id="popup">
    <div class="popup-title">⚠ SYSTEM ERROR</div>
    <div class="popup-content" id="popupText">
        Что-то пошло не так!
    </div>
    <button onclick="closePopup()">OK</button>
</div>

<script src="app.js"></script>

</body>
</html>
